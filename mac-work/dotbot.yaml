- defaults:
    link:
      relink: true
      type: symlink
      relative: false
      canonicalize: true
      force: true
      create: true
      glob: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- clean:
    ~/:
      force: false
    ~/.config:
      force: true
      recursive: true

# 目标路径含 Library/Application Support，超 80 列不可避免
# yamllint disable rule:line-length
- link:
    # home / config / scripts
    ~/: ./home/.*
    ~/.config/: ./config/*
    ~/.albert-scripts/: ../albert-scripts

    # zed
    ~/.config/zed/settings.json: ./misc/zed/settings.json

    # AI agents
    ~/.claude/: ./home-files/.claude/*
    ~/.pi/agent/: ./home-files/.pi/agent/*

    # VSCode
    ~/Library/Application Support/Code/User/settings.json: ./misc/vscode/settings.json
    ~/Library/Application Support/Code/User/keybindings.json: ./misc/vscode/keybindings.json
    ~/Library/Application Support/Code/User/globalStorage/alefragnani.project-manager/projects.json: ./misc/project-manager/projects.json

    # CodeBuddy
    ~/Library/Application Support/CodeBuddy CN/User/settings.json: ./misc/CodeBuddy/settings.json
    ~/Library/Application Support/CodeBuddy CN/User/keybindings.json: ./misc/CodeBuddy/keybindings.json
    ~/Library/Application Support/CodeBuddy CN/User/globalStorage/alefragnani.project-manager/projects.json: ./misc/project-manager/codebuddy-projects.json

    # Cursor
    ~/Library/Application Support/Cursor/User/settings.json: ./misc/cursor/settings.json
    ~/Library/Application Support/Cursor/User/keybindings.json: ./misc/cursor/keybindings.json
    ~/Library/Application Support/Cursor/User/globalStorage/alefragnani.project-manager/projects.json: ./misc/project-manager/cursor-projects.json

# yamllint enable rule:line-length

- shell:
    - command: >-
        [ -d $HOME/.oh-my-zsh/ ] && bash ./init-scripts/init.sh
        || echo 'omz installed'
      description: for test

