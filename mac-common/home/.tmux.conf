# -----------------------------------
# ------- General Settings ----------
# -----------------------------------
# Terminal settings
set-option -g default-terminal "xterm-256color"
set-option -as terminal-overrides ",xterm-256color:Tc"

# Escape time (default 500ms is too slow, breaks TUI apps like Claude Code)
# set -sg escape-time 10

# History and exit behavior
set -g history-limit 1000000
set -g remain-on-exit off

# Path settings
tmux_conf_new_window_retain_current_path=true
tmux_conf_new_pane_retain_current_path=true
tmux_conf_new_pane_reconnect_ssh=false
tmux_conf_new_session_prompt=false

# Change prefix key to C-a
# unbind C-b
# set -g prefix C-a

# Window title settings
set -g set-titles on
set -g set-titles-string "#I:#W"

# Start indexing from 1
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# Vi mode
set -g status-keys vi
set -g mode-keys vi
set-window-option -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# pbcopy is Mac-specific
unbind-key -T copy-mode-vi v
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle \; send -X begin-selection "pbcopy"
bind-key -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"
bind-key -T copy-mode-vi i send-keys -X cancel
# Keep the viewport stable after mouse copy; press q or i to leave copy mode.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Status bar
set-option -g status-right ""

# Fzf
bind C-f display-popup -E "\
 tmux list-sessions -F '#{session_name}' |\
 fzf --reverse --header jump-to-session --preview 'tmux capture-pane -pt {}' |\
 xargs tmux switch-client -t"

# -----------------------------------
# -------- command keys -------------
# -----------------------------------
# set -g allow-passthrough on
# set -as terminal-features 'xterm*:extkeys'
# set -s extended-keys on

# -----------------------------------
# ------- Clipboard Settings --------
# -----------------------------------
tmux_conf_copy_to_os_clipboard=true
set -s set-clipboard on
set -as terminal-overrides ',xterm-256color:Ms=\E]52;%p1%s;%p2%s\007'

# -----------------------------------
# --------- Vscode Settings ---------
# -----------------------------------
# update VSCODE variables from integrated terminal so that `code` command opens in current window
# set-option -g update-environment "DISPLAY SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION VSCODE_GIT_ASKPASS_NODE VSCODE_GIT_ASKPASS_MAIN VSCODE_GIT_IPC_HANDLE VSCODE_IPC_HOOK_CLI VSCODE_INJECTION VSCODE_GIT_IPC_AUTH_TOKEN PATH GIT_ASKPASS TERM_PROGRAM TERM_PROGRAM_VERSION BROWSER"

# -----------------------------------
# -------- Window Settings ----------
# -----------------------------------
bind e select-layout even-horizontal
bind p command-prompt -p "move to window:" "join-pane -t ':%%'"

# -----------------------------------
# ---------- TPM Settings -----------
# -----------------------------------
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-dir '/data/misc/.tmux/resurrect'

set -g @plugin 'sainnhe/tmux-fzf'
TMUX_FZF_LAUNCH_KEY="C-j"

set -g @keylocker-toggle-bind 'C-\'
set -g @keylocker-lock-bind 'None'
set -g @keylocker-unlock-bind 'None'

set -g @plugin 'thesast/tmux-keylocker'

set -g @plugin 'wfxr/tmux-power'
set -g @tmux_power_theme 'snow'
set -g @tmux_power_left_b  '  #S'
set -g @tmux_power_left_a  ''
set -g status-position top
set -g @tmux_power_right_y  '  #(basename #{pane_current_path})'
set -g @tmux_power_right_z '  #(cd #{pane_current_path} && git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "None")'
set -g @tmux_power_g0 "#1e1f28"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# -----------------------------------
# ------ Keylocker Indicator --------
# -----------------------------------
# Must come after tpm so plugins cannot overwrite status-right.
# @keylocker-status is "0" when unlocked, else the path of the saved keymap file.
set -ga status-right '#{?@keylocker-status,#[fg=colour255]#[bg=colour196]#[bold]  LOCKED #[default],}'

setw -g pane-active-border-style fg=white
setw -g pane-border-style fg=colour15

# 不需要前缀键，直接 Ctrl + 数字切换窗口
bind-key -n C-1 select-window -t 1
bind-key -n C-2 select-window -t 2
bind-key -n C-3 select-window -t 3
bind-key -n C-4 select-window -t 4
bind-key -n C-5 select-window -t 5
bind-key -n C-6 select-window -t 6
bind-key -n C-7 select-window -t 7
bind-key -n C-8 select-window -t 8
bind-key -n C-9 select-window -t 9

