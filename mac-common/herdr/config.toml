# ==============================================================================
# herdr 配置（mac-common，体验期）
#
# 链接位置：~/.config/herdr/config.toml（dotbot 只链接这个文件，
#           ~/.config/herdr/ 下的 session.json / 日志等运行时文件不入库）
# 生效方式：herdr server reload-config，或 herdr 内 prefix+shift+r
# 校验版本：herdr 0.8.0（protocol 19）
# 完整默认值：herdr --default-config
#
# 对齐原则：尽量复刻 mac-common/home/.tmux.conf 的手感，tmux 本身不动。
# ==============================================================================

# 跳过首次引导（引导流程会回写本文件，而本文件是 dotfiles 里的 symlink）
onboarding = false

[theme]
name = "catppuccin"

[terminal]
# 新 pane / tab 跟随来源 pane 的 cwd（≈ tmux_conf_new_*_retain_current_path）
new_cwd = "follow"

[keys]
# ==============================================================================
# tmux 风格键位：tmux 默认键 + mac-common/home/.tmux.conf 里的自定义键
# herdr 自己的默认键在不冲突时保留为别名（v / minus / g / b 等）
# 内置动作和 [[keys.command]] 同键时内置动作胜出，所以要让位的内置键必须显式改掉
# ==============================================================================
prefix = "ctrl+b"

# ---- window（= herdr tab）----
new_tab = "prefix+c"                             # c  new-window
next_tab = "prefix+n"                            # n  next-window
previous_tab = "prefix+shift+p"                  # p  被你的 .tmux.conf 改成 join-pane，这里同样让位
rename_tab = "prefix+,"                          # ,  rename-window
close_tab = "prefix+&"                           # &  kill-window
switch_tab = ["prefix+1..9", "ctrl+1..9"]        # 1..9 + bind -n C-1..9

# ---- session（= herdr workspace）----
rename_workspace = "prefix+$"                    # $  rename-session
previous_workspace = "prefix+("                  # (  switch-client -p
next_workspace = "prefix+)"                      # )  switch-client -n
detach = "prefix+d"                              # d  detach-client
workspace_picker = "prefix+s"                    # s  choose-session
goto = ["prefix+w", "prefix+ctrl+f", "prefix+g"] # w  choose-tree / 你的 C-f fzf
settings = "prefix+shift+s"                      # herdr 默认 prefix+s，让给 choose-session

# ---- pane ----
split_vertical = ["prefix+%", "prefix+v"]          # %  split-window -h（左右）
split_horizontal = ["prefix+\"", "prefix+minus"]   # "  split-window -v（上下）
close_pane = "prefix+x"                          # x  kill-pane
zoom = "prefix+z"                                # z  resize-pane -Z
focus_pane_left = ["prefix+h", "prefix+left"]    # h/←  select-pane -L
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]
cycle_pane_next = ["prefix+o", "prefix+tab"]     # o  select-pane -t :.+
last_pane = "prefix+;"                           # ;  last-pane
swap_pane_left = ["prefix+{", "prefix+shift+h"]  # {  swap-pane -U（herdr 按方向，近似）
swap_pane_right = ["prefix+}", "prefix+shift+l"] # }  swap-pane -D
resize_mode = "prefix+r"                         # herdr 独有：进入后 hjkl 连续调整

# ---- 其它 ----
copy_mode = "prefix+["                           # [  copy-mode
help = "prefix+?"                                # ?  list-keys
reload_config = "prefix+shift+r"
toggle_sidebar = "prefix+b"
# 下面三个 herdr 默认键与上面的 tmux 键冲突，换位
edit_scrollback = "prefix+shift+e"              # 默认 prefix+e → 让给 equalize
open_notification_target = "prefix+shift+o"     # 默认 prefix+o → 让给 select-pane next
rename_pane = "prefix+shift+t"                   # 默认 prefix+shift+p → 让给 previous_tab

# ---- 自定义命令：补齐 herdr 没有的 tmux 动作 ----
# e  ≈ 你的 bind e select-layout even-horizontal（所有 pane 排成一行再均分）
[[keys.command]]
key = "prefix+e"
type = "shell"
command = "python3 ~/.albert-scripts/osx/herdr/herdr-ab.py even right"
description = "even-horizontal"

# C-e  ≈ linux .tmux.conf 的 bind C-e select-layout even-vertical
[[keys.command]]
key = "prefix+ctrl+e"
type = "shell"
command = "python3 ~/.albert-scripts/osx/herdr/herdr-ab.py even down"
description = "even-vertical"

# =  ≈ select-layout -E（结构不变，只把比例均分）
[[keys.command]]
key = "prefix+="
type = "shell"
command = "python3 ~/.albert-scripts/osx/herdr/herdr-ab.py equal"
description = "balance splits"

# p  ≈ 你的 bind p join-pane（fzf 选目标 tab）
[[keys.command]]
key = "prefix+p"
type = "popup"
command = "python3 ~/.albert-scripts/osx/herdr/herdr-ab.py move"
description = "join pane to tab"
width = "60%"
height = "50%"

# !  ≈ break-pane
[[keys.command]]
key = "prefix+!"
type = "shell"
command = "python3 ~/.albert-scripts/osx/herdr/herdr-ab.py break"
description = "break pane to new tab"

# C-←↑↓→  ≈ resize-pane -L/-U/-D/-R（0.8.0 没有 resize_pane_* 键，走 CLI）
[[keys.command]]
key = "prefix+ctrl+left"
type = "shell"
command = "herdr pane resize --current --direction left --amount 0.05"
description = "resize left"

[[keys.command]]
key = "prefix+ctrl+right"
type = "shell"
command = "herdr pane resize --current --direction right --amount 0.05"
description = "resize right"

[[keys.command]]
key = "prefix+ctrl+up"
type = "shell"
command = "herdr pane resize --current --direction up --amount 0.05"
description = "resize up"

[[keys.command]]
key = "prefix+ctrl+down"
type = "shell"
command = "herdr pane resize --current --direction down --amount 0.05"
description = "resize down"

# lazygit 浮窗（herdr 文档示例，体验 popup 能力）
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "85%"
height = "85%"

[ui]
# tmux 新建 window 不提示命名
prompt_new_tab_name = false
tab_bar_position = "top"

show_agent_labels_on_pane_borders = true
[ui.toast]
# agent 完成 / 需要输入时，在 herdr 内弹提示
delivery = "herdr"

[session]
# server 重启后自动 resume 支持的 agent 会话（pi/claude/codex/droid…）
resume_agents_on_restore = true

[advanced]
# ≈ history-limit 1000000；herdr 按字节计，默认 10MB，这里给 50MB/pane
scrollback_limit_bytes = 50000000

[experimental]
# 中文输入法：TUI agent 隐藏光标时候选框也能跟随
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "pi", "codex"]
# 进入 prefix 时临时切到英文输入源，避免中文输入法吞掉 prefix 后的按键
switch_ascii_input_source_in_prefix = true
# 屏幕内容落盘（重启后回放），会把终端输出写到磁盘，默认关闭
pane_history = false
