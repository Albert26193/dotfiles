- defaults:
    link:
      relink: true
      type: symlink
      relative: false
      canonicalize: true

- clean:
    ~/:
      force: false
    ~/.config:
      force: true
      recursive: true

- link:
    ~/:
      force: true
      glob: true
      path: ./home/.*
    ~/.config/:
      force: true
      glob: true
      path: ./config/*
    "~/.albert-scripts/":
      force: true
      path: ../albert-scripts
    "~/.config/zed/settings.json":
      force: true
      glob: true
      path: ./misc/zed/settings.json
    "~/.config/zed/keymap.json":
      force: true
      glob: true
      path: ./misc/zed/keymap.json
    "~/.claude/":
      force: true
      create: true
      glob: true
      path: ./home-files/.claude/*
    "~/.codex/":
      force: true
      create: true
      glob: true
      path: ./home-files/.codex/*
    "~/Library/Application Support/Code/User/globalStorage/alefragnani.project-manager/projects.json":
      force: true
      glob: true
      path: ./misc/project-manager/projects.json
    # cursor
    # "~/Library/Application Support/Cursor/User/settings.json":
    #   force: true
    #   glob: true
    #   path: ./misc/cursor/settings.json
    # "~/Library/Application Support/Cursor/User/keybindings.json":
    #   force: true
    #   glob: true
    #   path: ./misc/cursor/keybindings.json
    # "~/Library/Application Support/Cursor/User/globalStorage/alefragnani.project-manager/projects.json":
    #   force: true
    #   glob: true
    #   path: ./misc/project-manager/cursor-projects.json



- shell:
  - 
    command: " [ -d $HOME/.oh-my-zsh/ ] && bash ./init-scripts/init.sh \
              || echo 'omz installed' "
    stdin: true
    stdout: true
    stderr: true
    description: for test
    quiet: false

