- defaults:
    link:
      relink: true
      type: symlink
      relative: false
      canonicalize: true
      force: true
      create: true
      glob: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- clean:
    ~/:
      force: false
    ~/.config:
      force: true
      recursive: true

- link:
    # home / config / scripts
    ~/: ./home/.*
    ~/.config/: ./config/*
    ~/.albert-scripts/: ../albert-scripts
    ~/.local/bin/: ./local-bin/*

    # AI agents
    ~/.tclaude/: ./home-files/.tclaude/*
    ~/.tcodex/: ./home-files/.tcodex/*
    ~/.codebuddy/: ./home-files/.codebuddy/*
    ~/.claude/: ./home-files/.claude/*
    ~/.codex/: ./home-files/.codex/*
    ~/.pi/agent/: ./home-files/.pi/agent/*
    ~/.config/opencode/: ./config-files/opencode/*

- shell:
    - command: >-
        [ -d $HOME/.oh-my-zsh/ ] && bash ./init-scripts/init.sh
        || echo 'omz installed'
      description: for test

