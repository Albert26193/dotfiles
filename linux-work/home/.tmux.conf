# -----------------------------------
# ------- General Settings ----------
# -----------------------------------
set -g focus-events on

# Terminal settings
set-option -g default-terminal "xterm-256color"
set-option -as terminal-overrides ",xterm-256color:Tc"

# Escape time (default 500ms is too slow, breaks TUI apps like Claude Code)
# set -sg escape-time 10

# History and exit behavior
set -g history-limit 1000000
set -g remain-on-exit off

# Path settings
tmux_conf_new_window_retain_current_path=true
tmux_conf_new_pane_retain_current_path=true
tmux_conf_new_pane_reconnect_ssh=false
tmux_conf_new_session_prompt=false

# Change prefix key to C-a
unbind C-b
set -g prefix C-a

# Window title settings
set -g set-titles on
set -g set-titles-string "#I:#W"

# Start indexing from 1
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# Vi mode
set -g status-keys vi
set -g mode-keys vi
set-window-option -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# pbcopy is Mac-specific
unbind-key -T copy-mode-vi v
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle \; send -X begin-selection "pbcopy"
bind-key -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"
bind-key -T copy-mode-vi i send-keys -X cancel
# Keep the viewport stable after mouse copy; press q or i to leave copy mode.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Status bar
set-option -g status-right ""

# Fzf
bind C-f display-popup -E "\
 tmux list-sessions -F '#{session_name}' |\
 fzf --reverse --header jump-to-session --preview 'tmux capture-pane -pt {}' |\
 xargs tmux switch-client -t"

