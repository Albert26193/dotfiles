- defaults:
    link:
      relink: true
      type: symlink
      relative: false
      canonicalize: true
      force: true
      create: true
      glob: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- clean:
    ~/:
      force: false
    ~/.config:
      force: true
      recursive: true

- link:
    # home / config / scripts
    ~/: ./home/.*
    ~/.config/: ./config/*
    ~/.albert-scripts/: ../albert-scripts

    # AI agents
    ~/.claude/: ./home-files/.claude/*
    ~/.pi/agent/: ./home-files/.pi/agent/*
    ~/.config/opencode/: ./config-files/opencode/*

